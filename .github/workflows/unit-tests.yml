name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w \$(find . -name '*.go' -not -path './.git/*')"
            exit 1
          fi

      # pkg/policy's command condition is checked against bash and zsh
      # themselves, each in a bubblewrap sandbox (command_shell_test.go).
      # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap
      # needs, behind this sysctl. The comparison is required here, so a
      # runner change can't quietly turn it into a skip.
      - name: Shells and a sandbox for the command condition's comparison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap zsh
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run unit tests
        env:
          ATRYUM_SHELL_COMPARISON: required
        run: go test ./...
