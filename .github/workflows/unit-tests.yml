name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w \$(find . -name '*.go' -not -path './.git/*')"
            exit 1
          fi

      - name: Run unit tests
        run: go test ./...

  # The LiteLLM guardrail in examples/llm-gateway is what customers deploy in
  # their LiteLLM proxy; its tests need LiteLLM itself, at the version the
  # example is written against.
  litellm-guardrail:
    name: LiteLLM guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LiteLLM
        run: pip install "litellm[proxy]==1.106.6"

      - name: Run the guardrail's tests
        working-directory: examples/llm-gateway/litellm
        run: python -m unittest discover -s . -p 'test_*.py' -v
