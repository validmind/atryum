name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Justfile"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w \$(find . -name '*.go' -not -path './.git/*')"
            exit 1
          fi

      # pkg/policy's command condition is tested against real bash and zsh,
      # each run inside a bubblewrap (bwrap) sandbox so nothing a test line
      # names can actually run (see command_shell_test.go). This step
      # installs bwrap and zsh (bash is already on the runner). bwrap needs
      # unprivileged user namespaces, which Ubuntu 24.04 blocks unless this
      # sysctl is set to 0.
      - name: Shells and a sandbox for the command condition's comparison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap zsh
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run unit tests
        env:
          # Without this, the shell comparison skips when it can't run. With
          # it, the tests fail unless bash and zsh, each with -c and
          # interactively, were compared, so a runner change can't quietly
          # turn the comparison into a skip.
          ATRYUM_SHELL_COMPARISON: required
        run: go test ./...
